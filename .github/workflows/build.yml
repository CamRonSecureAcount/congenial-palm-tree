name: "🪨 Pebble 0.5.0 — Slate"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  slate:
    name: "🪨 Build Pebble 0.5 — Slate"
    runs-on: ubuntu-latest

    steps:
      - name: "📦 Checkout Pebble"
        uses: actions/checkout@v4

      - name: "🔧 Install build tools"
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-arm \
            imagemagick \
            xxd

          echo "🪨 Slate kitchen ready."

      # ============================================================
      # PEBBLE SHORE
      # ============================================================

      - name: "🏝️ Cook Pebble Shore"
        shell: bash
        run: |
          set -e

          mkdir -p build/wallpaper

          WALLPAPER="assets/IMG_1526.gif"

          echo "========================================"
          echo "       PEBBLE WALLPAPER KITCHEN"
          echo "========================================"

          if [ ! -f "$WALLPAPER" ]; then
            echo "💀 WHERE THE FUCK IS THE BEACH"
            echo "Expected: $WALLPAPER"
            exit 1
          fi

          echo "🏝️ Found $WALLPAPER"

          identify "$WALLPAPER" | head -n 5 || true

          echo "🪨 Extracting first Slate frame..."

          convert "$WALLPAPER[0]" \
            -resize '640x480!' \
            -alpha off \
            build/wallpaper/boot.png

          echo "🎨 Converting wallpaper to RGB..."

          convert build/wallpaper/boot.png \
            -depth 8 \
            RGB:build/wallpaper/boot.rgb

          echo "✓ Pebble Shore prepared."

      # ============================================================
      # EMBED WALLPAPER
      # ============================================================

      - name: "🪨 Embed Slate assets"
        shell: bash
        run: |
          set -e

          mkdir -p build/generated

          echo "🪨 Converting Pebble Shore into C..."

          xxd -i \
            build/wallpaper/boot.rgb \
            > build/generated/boot_wallpaper.h

          echo "✓ Wallpaper header generated."

          wc -c build/wallpaper/boot.rgb
          wc -c build/generated/boot_wallpaper.h

          echo "Chip: beach acquired 😎"

      # ============================================================
      # GENERATE SLATE BOOT UI
      # ============================================================

      - name: "✨ Generate Slate loader"
        shell: bash
        run: |
          set -e

          mkdir -p build/generated

          cat > build/generated/slate_boot.h <<'SLATEEOF'
          #ifndef PEBBLE_SLATE_BOOT_H
          #define PEBBLE_SLATE_BOOT_H

          typedef struct {
              unsigned int progress;
              const char *message;
              const char *chip;
          } slate_boot_stage_t;

          static const slate_boot_stage_t slate_boot_stages[] = {
              {  5, "Starting Pebble",       "Chip: ...zzz" },
              { 15, "Starting kernel",       "Chip: huh?" },
              { 28, "Starting display",      "Chip: OOO COLORS" },
              { 42, "Loading Chalk",         "Chip: security rock deployed." },
              { 57, "Mounting Amethyst",     "Chip: shiny filesystem time." },
              { 70, "Starting Stoneyard",    "Chip: packages acquired." },
              { 84, "Loading Pebble Shore",  "Chip: BEACH EPISODE!" },
              { 94, "Waking Chip",           "Chip: five more minutes..." },
              {100, "Ready",                 "Chip: LET'S ROCK." }
          };

          #define SLATE_BOOT_STAGE_COUNT \
              (sizeof(slate_boot_stages) / sizeof(slate_boot_stages[0]))

          #endif
          SLATEEOF

          echo "✓ Dynamic Slate boot stages generated."

      # ============================================================
      # BUILD
      # ============================================================

      - name: "🔥 Build Pebble"
        shell: bash
        run: |
          set -e

          mkdir -p build

          echo "========================================"
          echo "          PEBBLE 0.5 — SLATE"
          echo "========================================"

          if [ ! -f linker.ld ]; then
            echo "💀 linker.ld is missing"
            exit 1
          fi

          if [ ! -f src/kernel.c ]; then
            echo "💀 src/kernel.c is missing"
            exit 1
          fi

          CFLAGS="-ffreestanding -nostdlib -nostartfiles -O2 -Wall -Wextra"

          SOURCES=""

          for file in src/*.c; do
            [ -e "$file" ] || continue

            obj="build/$(basename "${file%.c}").o"

            echo "🔨 $file"

            aarch64-linux-gnu-gcc \
              $CFLAGS \
              -Ibuild/generated \
              -Isrc \
              -c "$file" \
              -o "$obj"

            SOURCES="$SOURCES $obj"
          done

          if [ -f src/boot.S ]; then
            echo "🔨 src/boot.S"

            aarch64-linux-gnu-gcc \
              -ffreestanding \
              -c src/boot.S \
              -o build/boot.o

            SOURCES="$SOURCES build/boot.o"
          fi

          echo "🔗 Linking Slate..."

          aarch64-linux-gnu-ld \
            -T linker.ld \
            $SOURCES \
            -o build/pebble.elf

          echo ""
          echo "🪨 Pebble ELF:"
          ls -lh build/pebble.elf

      # ============================================================
      # VERIFY
      # ============================================================

      - name: "🔎 Inspect Pebble"
        shell: bash
        run: |
          set -e

          echo "Architecture:"
          aarch64-linux-gnu-readelf -h build/pebble.elf

          echo ""
          echo "Sections:"
          aarch64-linux-gnu-readelf -S build/pebble.elf

          echo ""
          echo "🪨 ELF survived inspection."

      # ============================================================
      # BOOT TEST
      # ============================================================

      - name: "🚀 Boot Slate"
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          BOOTING THE ROCK"
          echo "========================================"

          timeout 10s \
            qemu-system-aarch64 \
              -M virt \
              -cpu cortex-a53 \
              -m 128M \
              -nographic \
              -kernel build/pebble.elf \
              > build/boot.log 2>&1 || true

          echo ""
          echo "========== PEBBLE SERIAL =========="
          cat build/boot.log
          echo "==================================="

          if grep -q "Pebble" build/boot.log; then
            echo "✓ Pebble spoke."
          else
            echo "⚠️ Pebble produced no recognizable boot message."
          fi

      # ============================================================
      # RELEASE PACKAGE
      # ============================================================

      - name: "📦 Package Slate"
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp build/pebble.elf \
            build/release/pebble-0.5.0-slate.elf

          cp build/boot.log \
            build/release/boot.log

          cp build/wallpaper/boot.png \
            build/release/pebble-shore-preview.png

          cat > build/release/README.txt <<'EOF'
          Pebble OS 0.5.0 — Slate
          =======================

          Architecture: AArch64
          Kernel: Pebble
          Shell: Stone
          Package Manager: stpack
          Package Repository: Stoneyard
          Security: Chalk Guardian
          Filesystem: Amethyst
          Desktop: Slate

          Wallpaper:
          Pebble Shore

          Emotional Support Mineral:
          Chip

          No Linux.
          No distro underneath.
          Just Pebble.

          The rock lives.
          EOF

          echo "🪨 Slate packaged."

      - name: "⬆️ Upload Pebble 0.5"
        uses: actions/upload-artifact@v4
        with:
          name: pebble-0.5.0-slate
          path: build/release/
