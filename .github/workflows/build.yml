name: "🪨 Pebble 0.5.1 — Slate Graphics"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  graphics:
    runs-on: ubuntu-latest

    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Install tools"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-arm \
            imagemagick \
            xxd \
            socat

          mkdir -p src build/wallpaper release

      # ============================================================
      # WALLPAPER
      # ============================================================

      - name: "🏝️ Cook Pebble Shore"
        run: |
          set -e

          test -f assets/IMG_1526.gif || {
            echo "💀 WHERE THE FUCK IS THE BEACH"
            exit 1
          }

          convert "assets/IMG_1526.gif[0]" \
            -resize '640x480!' \
            -alpha off \
            build/wallpaper/shore.png

          convert build/wallpaper/shore.png \
            -depth 8 \
            RGB:build/wallpaper/shore.rgb

          SIZE="$(wc -c < build/wallpaper/shore.rgb)"
          echo "Wallpaper bytes: $SIZE"

          test "$SIZE" -eq 921600

          cd build/wallpaper
          xxd -i shore.rgb > ../../src/pebble_shore.h

      # ============================================================
      # GENERATE PEBBLE
      # ============================================================

      - name: "🧱 Generate Slate Graphics"
        run: |
          set -e

          # --------------------------------------------------------
          # BOOT
          # --------------------------------------------------------

          cat > src/boot.S <<'EOF'
          .section ".text.boot"
          .global _start

          _start:
              mrs x0, mpidr_el1
              and x0, x0, #0xff
              cbnz x0, halt

              ldr x0, =stack_top
              mov sp, x0

              ldr x0, =__bss_start
              ldr x1, =__bss_end

          clear_bss:
              cmp x0, x1
              b.hs kernel
              str xzr, [x0], #8
              b clear_bss

          kernel:
              bl pebble_main

          halt:
              wfe
              b halt

          .section ".bss"
          .align 12
          .skip 65536
          stack_top:
          EOF

          # --------------------------------------------------------
          # LINKER
          # --------------------------------------------------------

          cat > src/linker.ld <<'EOF'
          ENTRY(_start)

          SECTIONS
          {
              . = 0x40080000;

              .text : ALIGN(4096)
              {
                  KEEP(*(.text.boot))
                  *(.text*)
              }

              .rodata : ALIGN(4096)
              {
                  *(.rodata*)
              }

              .data : ALIGN(4096)
              {
                  *(.data*)
              }

              .bss : ALIGN(4096)
              {
                  __bss_start = .;
                  *(.bss*)
                  *(COMMON)
                  __bss_end = .;
              }

              __kernel_end = .;
          }
          EOF

          # --------------------------------------------------------
          # KERNEL
          # --------------------------------------------------------

          cat > src/kernel.c <<'EOF'
          typedef unsigned char      u8;
          typedef unsigned short     u16;
          typedef unsigned int       u32;
          typedef unsigned long      u64;
          typedef unsigned long      usize;

          #include "pebble_shore.h"

          /* ======================================================
             HARDWARE
             ====================================================== */

          #define UART_BASE   0x09000000UL
          #define FWCFG_BASE  0x09020000UL

          #define UART_DR (*(volatile u32 *)(UART_BASE + 0x00))
          #define UART_FR (*(volatile u32 *)(UART_BASE + 0x18))

          /*
           * Put framebuffer well above the kernel.
           *
           * QEMU virt RAM:
           *   0x40000000 ...
           *
           * Pebble:
           *   ~0x40080000
           *
           * Framebuffer:
           *   0x44000000
           */
          #define FB_ADDR   0x44000000UL
          #define FB_WIDTH  640
          #define FB_HEIGHT 480
          #define FB_STRIDE (FB_WIDTH * 4)

          static volatile u32 *fb =
              (volatile u32 *)FB_ADDR;

          /* ======================================================
             UART
             ====================================================== */

          static void putc(char c)
          {
              while (UART_FR & (1u << 5)) {}

              if (c == '\n') {
                  UART_DR = '\r';
                  while (UART_FR & (1u << 5)) {}
              }

              UART_DR = (u32)c;
          }

          static void print(const char *s)
          {
              while (*s)
                  putc(*s++);
          }

          static void print_uint(u32 n)
          {
              char buf[16];
              u32 i = 0;

              if (!n) {
                  putc('0');
                  return;
              }

              while (n) {
                  buf[i++] = '0' + (n % 10);
                  n /= 10;
              }

              while (i)
                  putc(buf[--i]);
          }

          /* ======================================================
             ENDIAN
             ====================================================== */

          static u16 be16(u16 x)
          {
              return (u16)((x >> 8) | (x << 8));
          }

          static u32 be32(u32 x)
          {
              return __builtin_bswap32(x);
          }

          static u64 be64(u64 x)
          {
              return __builtin_bswap64(x);
          }

          static void barrier(void)
          {
              __asm__ volatile("dsb sy" ::: "memory");
          }

          /* ======================================================
             FW_CFG
             ====================================================== */

          #define FW_CFG_FILE_DIR 0x0019

          #define FW_CFG_DMA_ERROR  0x01
          #define FW_CFG_DMA_READ   0x02
          #define FW_CFG_DMA_SKIP   0x04
          #define FW_CFG_DMA_SELECT 0x08
          #define FW_CFG_DMA_WRITE  0x10

          struct fw_dma {
              u32 control;
              u32 length;
              u64 address;
          } __attribute__((packed, aligned(8)));

          static volatile struct fw_dma dma;

          static void fw_select(u16 selector)
          {
              volatile u16 *reg =
                  (volatile u16 *)(FWCFG_BASE + 8);

              *reg = be16(selector);
              barrier();
          }

          static u8 fw_read8(void)
          {
              volatile u8 *data =
                  (volatile u8 *)(FWCFG_BASE + 0);

              return *data;
          }

          static u32 read_be32_stream(void)
          {
              u32 a = fw_read8();
              u32 b = fw_read8();
              u32 c = fw_read8();
              u32 d = fw_read8();

              return
                  (a << 24) |
                  (b << 16) |
                  (c << 8)  |
                   d;
          }

          static u16 read_be16_stream(void)
          {
              u16 a = fw_read8();
              u16 b = fw_read8();

              return (u16)((a << 8) | b);
          }

          static int name_is_ramfb(const char *name)
          {
              const char target[] = "etc/ramfb";
              u32 i;

              for (i = 0; target[i]; i++) {
                  if (name[i] != target[i])
                      return 0;
              }

              return name[i] == 0;
          }

          static u16 find_ramfb(void)
          {
              u32 count;
              u32 i;

              fw_select(FW_CFG_FILE_DIR);

              count = read_be32_stream();

              print("fw_cfg: directory entries = ");
              print_uint(count);
              print("\n");

              if (count > 512)
                  return 0;

              for (i = 0; i < count; i++) {
                  u32 size;
                  u16 selector;
                  u32 j;
                  char name[57];

                  size = read_be32_stream();
                  selector = read_be16_stream();

                  /* reserved */
                  fw_read8();
                  fw_read8();

                  for (j = 0; j < 56; j++)
                      name[j] = (char)fw_read8();

                  name[56] = 0;

                  if (name_is_ramfb(name)) {
                      print("fw_cfg: found etc/ramfb\n");
                      print("fw_cfg: ramfb config bytes = ");
                      print_uint(size);
                      print("\n");

                      return selector;
                  }
              }

              return 0;
          }

          static int fw_dma_write(
              u16 selector,
              const void *buffer,
              u32 length)
          {
              volatile u64 *dma_reg =
                  (volatile u64 *)(FWCFG_BASE + 16);

              u32 control =
                  ((u32)selector << 16) |
                  FW_CFG_DMA_SELECT |
                  FW_CFG_DMA_WRITE;

              dma.control = be32(control);
              dma.length  = be32(length);
              dma.address = be64((u64)buffer);

              barrier();

              /*
               * fw_cfg's DMA address register is big-endian.
               */
              *dma_reg = be64((u64)&dma);

              barrier();

              /*
               * Current QEMU completes this synchronously,
               * but still wait according to the interface contract.
               */
              {
                  u32 spins = 1000000;

                  while (spins--) {
                      u32 result;

                      barrier();
                      result = be32(dma.control);

                      if (result == 0)
                          return 1;

                      if (result & FW_CFG_DMA_ERROR)
                          return 0;
                  }
              }

              return 0;
          }

          /* ======================================================
             RAMFB
             ====================================================== */

          struct ramfb_cfg {
              u64 addr;
              u32 fourcc;
              u32 flags;
              u32 width;
              u32 height;
              u32 stride;
          } __attribute__((packed));

          /*
           * DRM_FORMAT_XRGB8888
           * fourcc('X','R','2','4')
           */
          #define FOURCC_XR24 \
              ((u32)'X' | ((u32)'R' << 8) | \
              ((u32)'2' << 16) | ((u32)'4' << 24))

          static int ramfb_init(void)
          {
              u16 selector;
              struct ramfb_cfg cfg;

              print("Slate: locating ramfb...\n");

              selector = find_ramfb();

              if (!selector) {
                  print("Slate: etc/ramfb NOT FOUND 💀\n");
                  return 0;
              }

              cfg.addr   = be64(FB_ADDR);
              cfg.fourcc = be32(FOURCC_XR24);
              cfg.flags  = be32(0);
              cfg.width  = be32(FB_WIDTH);
              cfg.height = be32(FB_HEIGHT);
              cfg.stride = be32(FB_STRIDE);

              print("Slate: configuring 640x480 XR24...\n");

              if (!fw_dma_write(
                      selector,
                      &cfg,
                      sizeof(cfg))) {

                  print("Slate: ramfb DMA write FAILED 💀\n");
                  return 0;
              }

              print("Slate: RAMFB ONLINE 🔥\n");
              return 1;
          }

          /* ======================================================
             PIXELS
             ====================================================== */

          static u32 rgb(u8 r, u8 g, u8 b)
          {
              /*
               * XR24 on little endian:
               *
               * memory = B G R X
               */
              return
                  ((u32)r << 16) |
                  ((u32)g << 8) |
                  ((u32)b);
          }

          static void pixel(
              int x,
              int y,
              u32 color)
          {
              if (x < 0 ||
                  y < 0 ||
                  x >= FB_WIDTH ||
                  y >= FB_HEIGHT)
                  return;

              fb[y * FB_WIDTH + x] = color;
          }

          static void rect(
              int x,
              int y,
              int w,
              int h,
              u32 color)
          {
              int yy;
              int xx;

              for (yy = y; yy < y + h; yy++) {
                  for (xx = x; xx < x + w; xx++)
                      pixel(xx, yy, color);
              }
          }

          static void fill(u32 color)
          {
              u32 i;

              for (i = 0;
                   i < FB_WIDTH * FB_HEIGHT;
                   i++)
                  fb[i] = color;
          }

          static void circle(
              int cx,
              int cy,
              int radius,
              u32 color)
          {
              int x;
              int y;

              for (y = -radius; y <= radius; y++) {
                  for (x = -radius; x <= radius; x++) {
                      if ((x*x + y*y) <= radius*radius)
                          pixel(cx+x, cy+y, color);
                  }
              }
          }

          /* ======================================================
             TINY FONT
             ====================================================== */

          static const u8 font[][7] = {
              /* A */
              {14,17,17,31,17,17,17},

              /* B */
              {30,17,17,30,17,17,30},

              /* C */
              {14,17,16,16,16,17,14},

              /* D */
              {30,17,17,17,17,17,30},

              /* E */
              {31,16,16,30,16,16,31},

              /* F */
              {31,16,16,30,16,16,16},

              /* G */
              {14,17,16,23,17,17,15},

              /* H */
              {17,17,17,31,17,17,17},

              /* I */
              {31,4,4,4,4,4,31},

              /* J */
              {7,2,2,2,18,18,12},

              /* K */
              {17,18,20,24,20,18,17},

              /* L */
              {16,16,16,16,16,16,31},

              /* M */
              {17,27,21,21,17,17,17},

              /* N */
              {17,25,21,19,17,17,17},

              /* O */
              {14,17,17,17,17,17,14},

              /* P */
              {30,17,17,30,16,16,16},

              /* Q */
              {14,17,17,17,21,18,13},

              /* R */
              {30,17,17,30,20,18,17},

              /* S */
              {15,16,16,14,1,1,30},

              /* T */
              {31,4,4,4,4,4,4},

              /* U */
              {17,17,17,17,17,17,14},

              /* V */
              {17,17,17,17,17,10,4},

              /* W */
              {17,17,17,21,21,21,10},

              /* X */
              {17,17,10,4,10,17,17},

              /* Y */
              {17,17,10,4,4,4,4},

              /* Z */
              {31,1,2,4,8,16,31}
          };

          static void letter(
              int x,
              int y,
              char c,
              int scale,
              u32 color)
          {
              int row;
              int col;
              const u8 *glyph;

              if (c < 'A' || c > 'Z')
                  return;

              glyph = font[c - 'A'];

              for (row = 0; row < 7; row++) {
                  for (col = 0; col < 5; col++) {
                      if (glyph[row] &
                          (1 << (4-col))) {

                          rect(
                              x + col*scale,
                              y + row*scale,
                              scale,
                              scale,
                              color
                          );
                      }
                  }
              }
          }

          static int text_width(
              const char *s,
              int scale)
          {
              int n = 0;

              while (*s++) n++;

              return n * 6 * scale;
          }

          static void text(
              int x,
              int y,
              const char *s,
              int scale,
              u32 color)
          {
              while (*s) {
                  if (*s != ' ')
                      letter(x, y, *s, scale, color);

                  x += 6 * scale;
                  s++;
              }
          }

          static void centered(
              int y,
              const char *s,
              int scale,
              u32 color)
          {
              int w = text_width(s, scale);

              text(
                  (FB_WIDTH - w) / 2,
                  y,
                  s,
                  scale,
                  color
              );
          }

          /* ======================================================
             SLATE LOADER
             ====================================================== */

          static void draw_rock(
              int cx,
              int cy,
              int size,
              u32 color)
          {
              rect(
                  cx - size,
                  cy - size/2,
                  size*2,
                  size,
                  color
              );

              rect(
                  cx - size + 5,
                  cy - size/2 - 5,
                  size*2 - 10,
                  5,
                  color
              );

              rect(
                  cx - size + 8,
                  cy + size/2,
                  size*2 - 16,
                  4,
                  color
              );
          }

          static void slate_loader(u32 progress)
          {
              int bar_width;

              fill(rgb(12, 18, 27));

              centered(
                  55,
                  "PEBBLE",
                  5,
                  rgb(245,245,245)
              );

              draw_rock(
                  320,
                  190,
                  45,
                  rgb(120,135,150)
              );

              circle(
                  302,
                  183,
                  4,
                  rgb(20,25,30)
              );

              circle(
                  338,
                  183,
                  4,
                  rgb(20,25,30)
              );

              rect(
                  304,
                  215,
                  32,
                  5,
                  rgb(80,95,110)
              );

              rect(
                  120,
                  300,
                  400,
                  24,
                  rgb(40,50,62)
              );

              bar_width =
                  (int)((progress * 392) / 100);

              rect(
                  124,
                  304,
                  bar_width,
                  16,
                  rgb(210,220,230)
              );

              centered(
                  350,
                  "STARTING SLATE",
                  2,
                  rgb(210,220,230)
              );

              barrier();
          }

          static void delay(void)
          {
              volatile u32 i;

              for (i = 0; i < 5000000; i++)
                  __asm__ volatile("nop");
          }

          /* ======================================================
             BEACH
             ====================================================== */

          static void draw_wallpaper(void)
          {
              u32 x;
              u32 y;
              usize p = 0;

              print("Slate: drawing Pebble Shore...\n");

              for (y = 0; y < FB_HEIGHT; y++) {
                  for (x = 0; x < FB_WIDTH; x++) {
                      u8 r = shore_rgb[p++];
                      u8 g = shore_rgb[p++];
                      u8 b = shore_rgb[p++];

                      fb[y * FB_WIDTH + x] =
                          rgb(r,g,b);
                  }
              }

              barrier();
          }

          /* ======================================================
             LOCK SCREEN
             ====================================================== */

          static void lock_screen(void)
          {
              /*
               * Card shadow.
               */
              rect(
                  183,
                  113,
                  286,
                  266,
                  rgb(15,22,30)
              );

              /*
               * Main card.
               */
              rect(
                  175,
                  105,
                  286,
                  266,
                  rgb(238,242,245)
              );

              centered(
                  135,
                  "PEBBLE",
                  3,
                  rgb(30,38,48)
              );

              draw_rock(
                  320,
                  220,
                  34,
                  rgb(100,115,130)
              );

              circle(
                  307,
                  214,
                  3,
                  rgb(20,25,30)
              );

              circle(
                  333,
                  214,
                  3,
                  rgb(20,25,30)
              );

              /*
               * PIN dots.
               */
              circle(275,290,7,rgb(55,65,75));
              circle(305,290,7,rgb(55,65,75));
              circle(335,290,7,rgb(55,65,75));
              circle(365,290,7,rgb(55,65,75));

              centered(
                  325,
                  "WELCOME",
                  2,
                  rgb(50,60,70)
              );

              barrier();
          }

          /* ======================================================
             BOOT
             ====================================================== */

          void pebble_main(void)
          {
              print(
                  "\n"
                  "====================================\n"
                  " PEBBLE 0.5.1 - SLATE GRAPHICS\n"
                  "====================================\n"
              );

              print("[ OK ] Pebble kernel\n");
              print("[ .. ] Looking for graphical display\n");

              if (!ramfb_init()) {
                  print(
                      "\n"
                      "💀 GRAPHICS FAILED\n"
                      "Stone serial lifeline still alive.\n"
                  );

                  for (;;)
                      __asm__ volatile("wfe");
              }

              print("[ OK ] fw_cfg\n");
              print("[ OK ] ramfb\n");
              print("[ OK ] 640x480 framebuffer\n");

              slate_loader(10);
              print("[SLATE 10%] Kernel\n");
              delay();

              slate_loader(25);
              print("[SLATE 25%] Display\n");
              delay();

              slate_loader(40);
              print("[SLATE 40%] Chalk\n");
              delay();

              slate_loader(55);
              print("[SLATE 55%] Amethyst\n");
              delay();

              slate_loader(70);
              print("[SLATE 70%] Stoneyard\n");
              delay();

              slate_loader(85);
              print("[SLATE 85%] Waking Chip\n");
              delay();

              slate_loader(100);
              print("[SLATE 100%] Ready\n");
              delay();

              draw_wallpaper();

              print("[ OK ] Pebble Shore rendered\n");

              lock_screen();

              print("[ OK ] Slate lock screen rendered\n");
              print("Chip: BEACH EPISODE 🔥\n");

              print(
                  "\n"
                  "====================================\n"
                  " HOLY SHIT THE ROCK HAS A SCREEN\n"
                  "====================================\n"
              );

              for (;;)
                  __asm__ volatile("wfe");
          }
          EOF

      # ============================================================
      # BUILD
      # ============================================================

      - name: "🔥 Compile Pebble"
        run: |
          set -e

          COMMON="-ffreestanding -fno-stack-protector -fno-pie -nostdlib"

          aarch64-linux-gnu-gcc \
            $COMMON \
            -c src/boot.S \
            -o build/boot.o

          aarch64-linux-gnu-gcc \
            $COMMON \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            -c src/kernel.c \
            -o build/kernel.o

          aarch64-linux-gnu-ld \
            -T src/linker.ld \
            build/boot.o \
            build/kernel.o \
            -o build/pebble.elf

          echo "🪨 Kernel:"
          ls -lh build/pebble.elf

      # ============================================================
      # GRAPHICAL BOOT
      # ============================================================

      - name: "🖥️ Boot graphical Pebble"
        run: |
          set -e

          rm -f build/qemu-monitor.sock
          rm -f build/boot.log
          rm -f release/slate-screen.ppm

          qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a53 \
            -m 128M \
            -kernel build/pebble.elf \
            -device ramfb \
            -display none \
            -serial file:build/boot.log \
            -monitor unix:build/qemu-monitor.sock,server=on,wait=off \
            &

          QEMU_PID=$!

          echo "QEMU PID: $QEMU_PID"

          # Wait for Pebble to reach the lock screen.
          for i in $(seq 1 30); do
            if grep -q \
              "Slate lock screen rendered" \
              build/boot.log 2>/dev/null; then
              echo "🔥 Slate reached lock screen!"
              break
            fi

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "💀 QEMU died."
              cat build/boot.log || true
              exit 1
            fi

            sleep 1
          done

          echo ""
          echo "========= PEBBLE SERIAL ========="
          cat build/boot.log
          echo "================================="

          grep -q \
            "Slate: RAMFB ONLINE" \
            build/boot.log

          grep -q \
            "SLATE 100%" \
            build/boot.log

          grep -q \
            "Pebble Shore rendered" \
            build/boot.log

          grep -q \
            "Slate lock screen rendered" \
            build/boot.log

          # Ask QEMU's monitor to dump the graphical console.
          echo \
            "screendump release/slate-screen.ppm" \
            | socat - UNIX-CONNECT:build/qemu-monitor.sock

          sleep 2

          kill "$QEMU_PID" || true
          wait "$QEMU_PID" || true

          test -s release/slate-screen.ppm

          echo ""
          echo "🔥🔥🔥 SCREENSHOT EXISTS 🔥🔥🔥"
          ls -lh release/slate-screen.ppm

      # ============================================================
      # CONVERT SCREENSHOT
      # ============================================================

      - name: "📸 Convert screenshot"
        run: |
          set -e

          convert \
            release/slate-screen.ppm \
            release/slate-screen.png

          identify release/slate-screen.png

          echo "🪨 Pebble is officially visible."

      # ============================================================
      # RELEASE
      # ============================================================

      - name: "📦 Package"
        run: |
          set -e

          cp build/pebble.elf \
            release/pebble-0.5.1-slate-aarch64.elf

          cp build/boot.log \
            release/boot.log

          cp build/wallpaper/shore.png \
            release/pebble-shore-source.png

          cat > release/README.txt <<'EOF'
          Pebble 0.5.1 - Slate Graphics
          =================================

          First Pebble graphical-display milestone.

          Hardware:
          - AArch64
          - QEMU virt
          - fw_cfg MMIO
