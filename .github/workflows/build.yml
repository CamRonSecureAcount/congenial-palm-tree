name: "🪨 Pebble 0.2.0 — Quarry"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  quarry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-arm

      - name: Generate Quarry source
        run: |
          mkdir -p src build release

          # ============================================
          # BOOT
          # ============================================

          cat > src/boot.S <<'EOF'
          .section ".text.boot"
          .global _start

          _start:
              mrs x0, mpidr_el1
              and x0, x0, #0xff
              cbnz x0, 9f

              ldr x0, =kernel_stack_top
              mov sp, x0

              ldr x0, =__bss_start
              ldr x1, =__bss_end

          1:
              cmp x0, x1
              b.hs 2f
              str xzr, [x0], #8
              b 1b

          2:
              bl pebble_main

          9:
              wfe
              b 9b

          .section ".bss"
          .align 12
          kernel_stack_bottom:
              .skip 32768
          kernel_stack_top:
          EOF

          # ============================================
          # EXCEPTION VECTOR + SVC HANDLER
          # ============================================

          cat > src/vectors.S <<'EOF'
          .section ".text"
          .align 11
          .global exception_vectors
          .global enter_el0

          exception_vectors:

          // Current EL with SP0
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic

          // Current EL with SPx
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic

          // Lower EL using AArch64
          .balign 128
          b lower_sync
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic

          // Lower EL using AArch32
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic
          .balign 128
          b exception_panic

          lower_sync:
              sub sp, sp, #(18 * 8)

              stp x0,  x1,  [sp, #(0 * 8)]
              stp x2,  x3,  [sp, #(2 * 8)]
              stp x4,  x5,  [sp, #(4 * 8)]
              stp x6,  x7,  [sp, #(6 * 8)]
              stp x8,  x9,  [sp, #(8 * 8)]
              stp x10, x11, [sp, #(10 * 8)]
              stp x12, x13, [sp, #(12 * 8)]
              stp x14, x15, [sp, #(14 * 8)]
              stp x16, x17, [sp, #(16 * 8)]

              mrs x1, esr_el1
              lsr x1, x1, #26

              // EC 0x15 = SVC from AArch64.
              cmp x1, #0x15
              b.ne exception_panic_saved

              // x8 = syscall number.
              mov x0, sp
              bl syscall_dispatch

              // Return value -> saved x0.
              str x0, [sp]

              ldp x0,  x1,  [sp, #(0 * 8)]
              ldp x2,  x3,  [sp, #(2 * 8)]
              ldp x4,  x5,  [sp, #(4 * 8)]
              ldp x6,  x7,  [sp, #(6 * 8)]
              ldp x8,  x9,  [sp, #(8 * 8)]
              ldp x10, x11, [sp, #(10 * 8)]
              ldp x12, x13, [sp, #(12 * 8)]
              ldp x14, x15, [sp, #(14 * 8)]
              ldp x16, x17, [sp, #(16 * 8)]

              add sp, sp, #(18 * 8)
              eret

          exception_panic_saved:
              add sp, sp, #(18 * 8)

          exception_panic:
              bl pebble_exception_panic

          1:
              wfe
              b 1b

          // x0 = userspace entry
          // x1 = userspace stack
          enter_el0:
              msr sp_el0, x1
              msr elr_el1, x0

              // EL0t, interrupts masked during this early implementation.
              mov x2, #0x3c0
              msr spsr_el1, x2

              isb
              eret
          EOF

          # ============================================
          # USERSPACE PROGRAMS
          # ============================================

          cat > src/users.S <<'EOF'
          .section ".rodata"

          .global hello_start
          .global hello_end
          .global chip_start
          .global chip_end

          // --------------------------------------------
          // hello.px payload
          // --------------------------------------------

          .align 4
          hello_start:

              adr x0, hello_text
              mov x8, #1
              svc #0

              // Ask kernel which EL the caller is from.
              mov x8, #2
              svc #0

              cmp x0, #0
              b.ne hello_bad

              adr x0, el0_text
              mov x8, #1
              svc #0

              mov x0, #0
              mov x8, #3
              svc #0

          hello_loop:
              b hello_loop

          hello_bad:
              adr x0, bad_text
              mov x8, #1
              svc #0

              mov x0, #1
              mov x8, #3
              svc #0

              b hello_loop

          hello_text:
              .asciz "hello.px: Hello from Pebble userspace!\nhello.px: write syscall = OK\n"

          el0_text:
              .asciz "hello.px: CurrentEL = EL0\n"

          bad_text:
              .asciz "hello.px: ERROR - not EL0\n"

          hello_end:

          // --------------------------------------------
          // chip.px payload
          // --------------------------------------------

          .align 4
          chip_start:

              adr x0, chip_text
              mov x8, #1
              svc #0

              mov x0, #0
              mov x8, #3
              svc #0

          chip_loop:
              b chip_loop

          chip_text:
              .asciz "\n       ___\n     /     \\\n    | o   o |\n    |   v   |\n     \\_____/\n      /   \\\n\nChip: holy rock, I'm in userspace.\n"

          chip_end:
          EOF

          # ============================================
          # KERNEL
          # ============================================

          cat > src/kernel.c <<'EOF'
          typedef unsigned long u64;
          typedef unsigned int  u32;
          typedef unsigned short u16;

          #define UART_BASE 0x09000000UL
          #define UART_DR (*(volatile u32 *)(UART_BASE + 0x00))
          #define UART_FR (*(volatile u32 *)(UART_BASE + 0x18))

          #define CAP_CONSOLE       (1ULL << 0)
          #define CAP_FILE_READ     (1ULL << 1)
          #define CAP_FILE_WRITE    (1ULL << 2)
          #define CAP_PROCESS       (1ULL << 3)
          #define CAP_NETWORK       (1ULL << 4)
          #define CAP_POWER         (1ULL << 5)
          #define CAP_ADMIN         (1ULL << 6)

          #define DANGEROUS_CAPS \
              (CAP_FILE_WRITE | CAP_NETWORK | CAP_POWER | CAP_ADMIN)

          #define SYS_WRITE       1
          #define SYS_CURRENT_EL  2
          #define SYS_EXIT        3

          extern unsigned char exception_vectors[];

          extern unsigned char hello_start[];
          extern unsigned char hello_end[];

          extern unsigned char chip_start[];
          extern unsigned char chip_end[];

          extern void enter_el0(void *entry, void *stack);

          static void uart_putc(char c)
          {
              while (UART_FR & (1u << 5)) {}

              if (c == '\n') {
                  UART_DR = '\r';
                  while (UART_FR & (1u << 5)) {}
              }

              UART_DR = (u32)c;
          }

          static void print(const char *s)
          {
              while (*s)
                  uart_putc(*s++);
          }

          static int streq(const char *a, const char *b)
          {
              while (*a && *b) {
                  if (*a != *b)
                      return 0;

                  a++;
                  b++;
              }

              return *a == *b;
          }

          struct pex {
              char magic[4];
              u16 version;
              u16 arch;
              u32 flags;

              u64 capabilities;

              const unsigned char *code;
              u64 code_size;

              const char *name;
          };

          static struct pex hello_pex = {
              {'P','E','X','E'},
              1,
              1,
              0,
              CAP_CONSOLE,
              hello_start,
              0,
              "hello.px"
          };

          static struct pex chip_pex = {
              {'P','E','X','E'},
              1,
              1,
              0,
              CAP_CONSOLE,
              chip_start,
              0,
              "chip.px"
          };

          static struct pex sus_pex = {
              {'P','E','X','E'},
              1,
              1,
              0,
              CAP_CONSOLE | CAP_POWER | CAP_ADMIN,
              hello_start,
              0,
              "free_nuggets_REAL.px"
          };

          static unsigned char user_area[16384]
              __attribute__((aligned(4096)));

          static unsigned char user_stack[16384]
              __attribute__((aligned(4096)));

          static volatile int process_exited = 0;
          static volatile u64 process_exit_code = 0;
          static u64 current_caps = 0;

          static void copy_bytes(
              unsigned char *dst,
              const unsigned char *src,
              u64 count
          )
          {
              u64 i;

              for (i = 0; i < count; i++)
                  dst[i] = src[i];
          }

          static int chalk_scan(struct pex *p)
          {
              print("\nCHALK GUARDIAN\n");
              print("Scanning ");
              print(p->name);
              print("...\n");

              if (p->magic[0] != 'P' ||
                  p->magic[1] != 'E' ||
                  p->magic[2] != 'X' ||
                  p->magic[3] != 'E') {

                  print("[!] Invalid PEX structure\n");
                  print("CHALK: BLOCKED\n");
                  return 0;
              }

              print("[OK] PEX structure\n");

              if (p->version != 1 || p->arch != 1) {
                  print("[!] Unsupported PEX target\n");
                  print("CHALK: BLOCKED\n");
                  return 0;
              }

              print("[OK] AArch64 target\n");

              if (p->capabilities & DANGEROUS_CAPS) {
                  print("[!] Dangerous capabilities detected\n");

                  if (p->capabilities & CAP_FILE_WRITE)
                      print("    filesystem.write\n");

                  if (p->capabilities & CAP_NETWORK)
                      print("    network.connect\n");

                  if (p->capabilities & CAP_POWER)
                      print("    system.power\n");

                  if (p->capabilities & CAP_ADMIN)
                      print("    system.admin\n");

                  print("CHALK: BLOCKED\n");
                  return 0;
              }

              print("[OK] Capabilities acceptable\n");
              print("CHALK: CLEAR\n");

              return 1;
          }

          /*
           * Register frame from vectors.S:
           *
           * frame[0]  = x0
           * frame[1]  = x1
           * ...
           * frame[8]  = x8
           */
          u64 syscall_dispatch(u64 *frame)
          {
              u64 number = frame[8];

              if (number == SYS_WRITE) {
                  if (!(current_caps & CAP_CONSOLE))
                      return (u64)-1;

                  print((const char *)frame[0]);
                  return 0;
              }

              if (number == SYS_CURRENT_EL) {
                  /*
                   * The synchronous exception came from the
                   * lower-EL AArch64 vector slot, therefore
                   * the caller was EL0.
                   */
                  return 0;
              }

              if (number == SYS_EXIT) {
                  process_exit_code = frame[0];
                  process_exited = 1;

                  /*
                   * Quarry's first process model does not yet
                   * context-switch back from EL0. Emit the
                   * result and stop this virtual CPU.
                   */
                  print("\nKernel: userspace requested exit\n");

                  if (process_exit_code == 0)
                      print("Kernel: exit code 0\n");
                  else
                      print("Kernel: non-zero exit\n");

                  print("Kernel: Quarry userspace test complete\n");

                  for (;;)
                      __asm__ volatile("wfe");
              }

              return (u64)-1;
          }

          void pebble_exception_panic(void)
          {
              print("\nPEBBLE PANIC\n");
              print("Unhandled exception.\n");

              for (;;)
                  __asm__ volatile("wfe");
          }

          static void install_vectors(void)
          {
              __asm__ volatile(
                  "msr vbar_el1, %0\n"
                  "isb\n"
                  :
                  : "r"(exception_vectors)
                  : "memory"
              );
          }

          static void launch_pex(struct pex *p)
          {
              u64 size;

              if (!chalk_scan(p))
                  return;

              size = p->code_size;

              if (size > sizeof(user_area)) {
                  print("PEX: image too large\n");
                  return;
              }

              copy_bytes(user_area, p->code, size);

              /*
               * We don't have an MMU yet, so EL0 and EL1
               * currently share the same physical address
               * space. Privilege separation is real, memory
               * isolation comes in the next memory milestone.
               */
              current_caps = p->capabilities;
              process_exited = 0;

              print("PEX: entering EL0...\n");

              __asm__ volatile(
                  "dsb ish\n"
                  "ic iallu\n"
                  "dsb ish\n"
                  "isb\n"
                  ::: "memory"
              );

              enter_el0(
                  user_area,
                  user_stack + sizeof(user_stack)
              );

              /*
               * ERET does not normally return here.
               */
              for (;;)
                  __asm__ volatile("wfe");
          }

          void pebble_main(void)
          {
              hello_pex.code_size =
                  (u64)(hello_end - hello_start);

              chip_pex.code_size =
                  (u64)(chip_end - chip_start);

              sus_pex.code_size =
                  hello_pex.code_size;

              install_vectors();

              print("\n");
              print("====================================\n");
              print("              PEBBLE\n");
              print("====================================\n\n");

              print("Pebble 0.2.0 \"Quarry\"\n");
              print("Architecture: AArch64\n\n");

              print("[ OK ] Pebble Kernel EL1\n");
              print("[ OK ] Exception vectors\n");
              print("[ OK ] SVC syscall gate\n");
              print("[ OK ] PEX v1 loader\n");
              print("[ OK ] Chalk Guardian\n\n");

              /*
               * First prove Chalk blocks the suspicious PEX.
               */
              chalk_scan(&sus_pex);

              print("\nLaunching hello.px...\n");

              /*
               * hello.px is our actual EL0 proof.
               *
               * chip.px is included as a second PEX image;
               * proper process-return/context switching lands
               * in the next Quarry update.
               */
              launch_pex(&hello_pex);
          }
          EOF

          # ============================================
          # LINKER
          # ============================================

          cat > src/linker.ld <<'EOF'
          ENTRY(_start)

          SECTIONS
          {
              . = 0x40080000;

              .text : ALIGN(4096)
              {
                  KEEP(*(.text.boot))
                  *(.text*)
              }

              .rodata : ALIGN(4096)
              {
                  *(.rodata*)
              }

              .data : ALIGN(4096)
              {
                  *(.data*)
              }

              .bss : ALIGN(4096)
              {
                  __bss_start = .;
                  *(.bss*)
                  *(COMMON)
                  __bss_end = .;
              }
          }
          EOF

      - name: 🔥 Compile Quarry
        run: |
          COMMON="-ffreestanding -fno-stack-protector -fno-pie -nostdlib"

          aarch64-linux-gnu-gcc $COMMON \
            -c src/boot.S \
            -o build/boot.o

          aarch64-linux-gnu-gcc $COMMON \
            -c src/vectors.S \
            -o build/vectors.o

          aarch64-linux-gnu-gcc $COMMON \
            -c src/users.S \
            -o build/users.o

          aarch64-linux-gnu-gcc $COMMON \
            -O2 \
            -Wall \
            -Wextra \
            -c src/kernel.c \
            -o build/kernel.o

          aarch64-linux-gnu-ld \
            -T src/linker.ld \
            build/boot.o \
            build/vectors.o \
            build/users.o \
            build/kernel.o \
            -o build/pebble.elf

          echo "🪨 Quarry compiled"
          file build/pebble.elf
          ls -lh build/pebble.elf

      - name: 🧪 Boot Quarry
        run: |
          set +e

          timeout 5s qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a53 \
            -m 128M \
            -nographic \
            -kernel build/pebble.elf \
            > build/boot.log 2>&1

          set -e

          cat build/boot.log

          echo ""
          echo "====== QUARRY TESTS ======"

          grep -q 'Pebble 0.2.0 "Quarry"' build/boot.log
          echo "✓ Pebble booted"

          grep -q "CHALK: BLOCKED" build/boot.log
          echo "✓ Chalk blocked dangerous PEX"

          grep -q "CHALK: CLEAR" build/boot.log
          echo "✓ Chalk cleared hello.px"

          grep -q "PEX: entering EL0" build/boot.log
          echo "✓ PEX loader entered userspace"

          grep -q "Hello from Pebble userspace" build/boot.log
          echo "✓ hello.px executed"

          grep -q "CurrentEL = EL0" build/boot.log
          echo "✓ REAL EL0 CONFIRMED"

          grep -q "write syscall = OK" build/boot.log
          echo "✓ SVC syscall succeeded"

          grep -q "exit code 0" build/boot.log
          echo "✓ userspace exited cleanly"

          echo ""
          echo "🪨🔥 QUARRY LIVES"

      - name: 📦 Package Quarry
        run: |
          cp build/pebble.elf release/pebble-aarch64.elf
          cp build/boot.log release/boot.log

          cat > release/README.txt <<'EOF'
          Pebble 0.2.0 "Quarry"

          Architecture: AArch64
          Target: QEMU virt

          New foundations:
          - EL1 Pebble kernel
          - EL0 Pebble userspace
          - AArch64 exception vectors
          - SVC syscall gate
          - PEX v1 executable container
          - Chalk Guardian capability scanning
          - hello.px userspace test
          - chip.px payload

          Important:
          Quarry establishes CPU privilege separation.
          Full virtual-memory isolation is still upcoming.

          The rock learned to run programs.
          EOF

      - name: ⬆️ Upload Quarry
        uses: actions/upload-artifact@v4
        with:
          name: pebble-0.2.0-quarry
          path: release/
