name: "🪨 Pebble 0.5.0 — Slate"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  slate:
    name: "🪨 Build Pebble 0.5 — Slate"
    runs-on: ubuntu-latest

    steps:
      - name: "📦 Checkout Pebble"
        uses: actions/checkout@v4

      - name: "🔧 Install tools"
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-arm \
            imagemagick \
            xxd

          echo "🪨 Slate kitchen ready."

      # ============================================================
      # PEBBLE SHORE
      # ============================================================

      - name: "🏝️ Cook Pebble Shore"
        shell: bash
        run: |
          set -e

          mkdir -p src build/wallpaper release

          WALLPAPER="assets/IMG_1526.gif"

          echo "========================================"
          echo "       PEBBLE WALLPAPER KITCHEN"
          echo "========================================"

          if [ ! -f "$WALLPAPER" ]; then
            echo "💀 WHERE THE FUCK IS THE BEACH"
            echo "Expected: $WALLPAPER"
            exit 1
          fi

          echo "🏝️ Found $WALLPAPER"

          FRAME_COUNT="$(identify "$WALLPAPER" | wc -l)"
          echo "🎞️ GIF contains $FRAME_COUNT frames"

          echo "🏝️ Extracting Slate boot wallpaper..."

          convert "${WALLPAPER}[0]" \
            -resize '640x480!' \
            -alpha off \
            build/wallpaper/shore.png

          echo "🎨 Converting beach to RGB..."

          convert build/wallpaper/shore.png \
            -depth 8 \
            RGB:build/wallpaper/shore.rgb

          EXPECTED=$((640 * 480 * 3))
          ACTUAL="$(wc -c < build/wallpaper/shore.rgb)"

          echo "Expected RGB bytes: $EXPECTED"
          echo "Actual RGB bytes:   $ACTUAL"

          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "💀 Wallpaper RGB size is wrong."
            exit 1
          fi

          echo "🪨 Embedding Pebble Shore..."

          (
            cd build/wallpaper
            xxd -i shore.rgb > ../../src/pebble_shore.h
          )

          echo "✓ Pebble Shore cooked."
          echo "Chip: BEACH ACQUIRED 🏝️"

      # ============================================================
      # GENERATE THE ACTUAL PEBBLE SOURCE
      # ============================================================

      - name: "🧱 Generate Slate"
        shell: bash
        run: |
          set -e

          mkdir -p src build release

          # --------------------------------------------------------
          # BOOT.S
          # --------------------------------------------------------

          cat > src/boot.S <<'EOF'
          .section ".text.boot"
          .global _start

          _start:
              mrs x0, mpidr_el1
              and x0, x0, #0xff
              cbnz x0, halt

              ldr x0, =stack_top
              mov sp, x0

              ldr x0, =__bss_start
              ldr x1, =__bss_end

          clear_bss:
              cmp x0, x1
              b.hs kernel
              str xzr, [x0], #8
              b clear_bss

          kernel:
              bl pebble_main

          halt:
              wfe
              b halt

          .section ".bss"
          .align 12
          .skip 32768
          stack_top:
          EOF

          # --------------------------------------------------------
          # LINKER
          # --------------------------------------------------------

          cat > src/linker.ld <<'EOF'
          ENTRY(_start)

          SECTIONS
          {
              . = 0x40080000;

              .text : ALIGN(4096)
              {
                  KEEP(*(.text.boot))
                  *(.text*)
              }

              .rodata : ALIGN(4096)
              {
                  *(.rodata*)
              }

              .data : ALIGN(4096)
              {
                  *(.data*)
              }

              .bss : ALIGN(4096)
              {
                  __bss_start = .;
                  *(.bss*)
                  *(COMMON)
                  __bss_end = .;
              }

              . = ALIGN(4096);
              __kernel_end = .;
          }
          EOF

          # --------------------------------------------------------
          # SLATE BOOT STATE
          # --------------------------------------------------------

          cat > src/slate.h <<'EOF'
          #ifndef PEBBLE_SLATE_H
          #define PEBBLE_SLATE_H

          typedef struct {
              unsigned int progress;
              const char *message;
              const char *chip;
          } slate_stage_t;

          static const slate_stage_t slate_stages[] = {
              {  5, "Starting Pebble",      "Chip: ...zzz" },
              { 15, "Starting kernel",      "Chip: huh?" },
              { 28, "Starting display",     "Chip: OOO COLORS" },
              { 42, "Loading Chalk",        "Chip: security rock deployed." },
              { 57, "Mounting Amethyst",    "Chip: shiny filesystem time." },
              { 70, "Starting Stoneyard",   "Chip: packages acquired." },
              { 84, "Loading Pebble Shore", "Chip: BEACH EPISODE!" },
              { 94, "Waking Chip",          "Chip: five more minutes..." },
              {100, "Ready",                "Chip: LET'S ROCK." }
          };

          #define SLATE_STAGE_COUNT \
              (sizeof(slate_stages) / sizeof(slate_stages[0]))

          #endif
          EOF

          # --------------------------------------------------------
          # KERNEL
          # --------------------------------------------------------

          cat > src/kernel.c <<'EOF'
          typedef unsigned int u32;
          typedef unsigned long u64;
          typedef unsigned long usize;

          #include "slate.h"
          #include "pebble_shore.h"

          #define UART_BASE 0x09000000UL
          #define UART_DR (*(volatile u32 *)(UART_BASE + 0x00))
          #define UART_FR (*(volatile u32 *)(UART_BASE + 0x18))

          static void putc(char c)
          {
              while (UART_FR & (1u << 5)) {}

              if (c == '\n') {
                  UART_DR = '\r';
                  while (UART_FR & (1u << 5)) {}
              }

              UART_DR = (u32)c;
          }

          static void print(const char *s)
          {
              while (*s)
                  putc(*s++);
          }

          static void print_uint(unsigned int value)
          {
              char buffer[16];
              unsigned int i = 0;

              if (value == 0) {
                  putc('0');
                  return;
              }

              while (value && i < sizeof(buffer)) {
                  buffer[i++] = (char)('0' + (value % 10));
                  value /= 10;
              }

              while (i)
                  putc(buffer[--i]);
          }

          static int eq(const char *a, const char *b)
          {
              while (*a && *b && *a == *b) {
                  a++;
                  b++;
              }

              return *a == *b;
          }

          static int starts(const char *s, const char *p)
          {
              while (*p) {
                  if (*s++ != *p++)
                      return 0;
              }

              return 1;
          }

          /* ======================================================
             SLATE
             ====================================================== */

          static unsigned int slate_progress = 0;

          static void slate_stage(unsigned int index)
          {
              const slate_stage_t *stage;

              if (index >= SLATE_STAGE_COUNT)
                  return;

              stage = &slate_stages[index];
              slate_progress = stage->progress;

              print("[SLATE ");
              print_uint(stage->progress);
              print("%] ");

              print(stage->message);
              print("\n       ");

              print(stage->chip);
              print("\n");
          }

          static void slate_boot(void)
          {
              unsigned int i;

              print(
                  "\n"
                  "====================================\n"
                  "          SLATE BOOT SYSTEM\n"
                  "====================================\n"
              );

              for (i = 0; i < SLATE_STAGE_COUNT; i++)
                  slate_stage(i);

              print("\nSlate: loader reached 100%.\n");
          }

          static void slate_wallpaper_probe(void)
          {
              usize expected = 640UL * 480UL * 3UL;

              print("\nSlate: checking Pebble Shore...\n");

              print("Slate: wallpaper bytes = ");
              print_uint(shore_rgb_len);
              print("\n");

              if ((usize)shore_rgb_len == expected) {
                  print("Slate: Pebble Shore is ready.\n");

                  /*
                   * Read a few bytes so the compiler/linker cannot
                   * discard our beautiful beach.
                   */
                  if (shore_rgb[0] ||
                      shore_rgb[1] ||
                      shore_rgb[2]) {
                      print("Chip: yep. that's definitely pixels.\n");
                  } else {
                      print("Chip: first pixel is suspiciously dark.\n");
                  }
              } else {
                  print("Slate: wallpaper size mismatch 💀\n");
              }
          }

          /* ======================================================
             CHALK GUARDIAN
             ====================================================== */

          #define CAP_CONSOLE  (1ULL << 0)
          #define CAP_FILES    (1ULL << 1)
          #define CAP_NETWORK  (1ULL << 2)
          #define CAP_POWER    (1ULL << 3)
          #define CAP_ADMIN    (1ULL << 4)

          #define DANGER (CAP_POWER | CAP_ADMIN)

          static int chalk_enabled = 1;

          static int chalk_scan(const char *name, u64 caps)
          {
              print("\nChalk: scanning ");
              print(name);
              print("...\n");

              if (!chalk_enabled) {
                  print("Chalk: disabled. you're on your own 💀\n");
                  return 1;
              }

              if (caps & DANGER) {
                  print("Chalk: absolutely not.\n");

                  if (caps & CAP_POWER)
                      print("  [!] system.power\n");

                  if (caps & CAP_ADMIN)
                      print("  [!] system.admin\n");

                  print("CHALK: BLOCKED\n");
                  return 0;
              }

              print("Chalk: looks edible enough.\n");
              print("CHALK: CLEAR\n");

              return 1;
          }

          /* ======================================================
             STP / STONEYARD
             ====================================================== */

          struct stp {
              char magic[4];

              const char *name;
              const char *version;
              const char *description;

              u64 capabilities;

              const char *provides;
          };

          static struct stp repo[] = {
              {
                  {'S','T','P','K'},
                  "chicken",
                  "1.0",
                  "An extremely important chicken.",
                  CAP_CONSOLE,
                  "chicken.px"
              },

              {
                  {'S','T','P','K'},
                  "chip",
                  "0.5",
                  "Pebble emotional support mineral.",
                  CAP_CONSOLE,
                  "chip.px"
              },

              {
                  {'S','T','P','K'},
                  "editor",
                  "0.1",
                  "Tiny Pebble text editor.",
                  CAP_CONSOLE | CAP_FILES,
                  "editor.px"
              },

              {
                  {'S','T','P','K'},
                  "free-nuggets-real",
                  "6.6.6",
                  "Definitely trustworthy.",
                  CAP_CONSOLE | CAP_POWER | CAP_ADMIN,
                  "totally_safe.px"
              }
          };

          #define REPO_COUNT \
              (sizeof(repo) / sizeof(repo[0]))

          #define MAX_INSTALLED 16

          static struct stp *installed[MAX_INSTALLED];
          static usize installed_count = 0;

          static struct stp *find_package(const char *name)
          {
              usize i;

              for (i = 0; i < REPO_COUNT; i++) {
                  if (eq(repo[i].name, name))
                      return &repo[i];
              }

              return 0;
          }

          static int already_installed(struct stp *p)
          {
              usize i;

              for (i = 0; i < installed_count; i++) {
                  if (installed[i] == p)
                      return 1;
              }

              return 0;
          }

          static void stpack_install(const char *name)
          {
              struct stp *p;

              print("\nstpack: searching Stoneyard...\n");

              p = find_package(name);

              if (!p) {
                  print("stpack: package not found.\n");
                  print("Chip: maybe it rolled away?\n");
                  return;
              }

              print("stpack: found ");
              print(p->name);
              print("-");
              print(p->version);
              print(".stp\n");

              if (already_installed(p)) {
                  print("stpack: already installed 😭\n");
                  return;
              }

              if (!chalk_scan(p->name, p->capabilities)) {
                  print("stpack: installation cancelled.\n");
                  print("Chip: yeahhhh I wouldn't eat that one.\n");
                  return;
              }

              if (installed_count >= MAX_INSTALLED) {
                  print("stpack: package store full.\n");
                  return;
              }

              print("\nstpack: unpacking");
              print("...............\n");

              installed[installed_count++] = p;

              print("stpack: installed ");
              print(p->name);
              print(" successfully.\n");

              if (eq(p->name, "chicken"))
                  print("stpack: chicken acquired. [nugget pending]\n");

              if (eq(p->name, "chip"))
                  print("Chip: wait... you installed ME?\n");
          }

          static void stpack_remove(const char *name)
          {
              usize i;

              for (i = 0; i < installed_count; i++) {
                  if (eq(installed[i]->name, name)) {
                      usize j;

                      for (j = i; j + 1 < installed_count; j++)
                          installed[j] = installed[j + 1];

                      installed_count--;

                      print("stpack: removed ");
                      print(name);
                      print(".\n");

                      if (eq(name, "chip"))
                          print("Chip: WAIT COME BACK—\n");

                      return;
                  }
              }

              print("stpack: that package isn't installed.\n");
          }

          static void stpack_list(void)
          {
              usize i;

              print("\nInstalled packages:\n");

              if (!installed_count) {
                  print("  nothing. absolutely barren.\n");
                  return;
              }

              for (i = 0; i < installed_count; i++) {
                  print("  ");
                  print(installed[i]->name);
                  print(" ");
                  print(installed[i]->version);
                  print("\n");
              }
          }

          static void stpack_search(void)
          {
              usize i;

              print("\nStoneyard packages:\n");

              for (i = 0; i < REPO_COUNT; i++) {
                  print("  ");
                  print(repo[i].name);
                  print(" ");
                  print(repo[i].version);
                  print(" - ");
                  print(repo[i].description);
                  print("\n");
              }
          }

          static void stpack_info(const char *name)
          {
              struct stp *p = find_package(name);

              if (!p) {
                  print("stpack: package not found.\n");
                  return;
              }

              print("\nPackage: ");
              print(p->name);

              print("\nVersion: ");
              print(p->version);

              print("\nProvides: ");
              print(p->provides);

              print("\nAbout: ");
              print(p->description);

              print("\n");
          }

          /* ======================================================
             STONE
             ====================================================== */

          static char command[256];

          static char getc(void)
          {
              while (UART_FR & (1u << 4)) {}
              return (char)(UART_DR & 0xff);
          }

          static void read_command(void)
          {
              usize i = 0;

              for (;;) {
                  char c = getc();

                  if (c == '\n' || c == '\r') {
                      command[i] = 0;
                      putc('\n');
                      return;
                  }

                  if ((c == 8 || c == 127) && i) {
                      i--;
                      print("\b \b");
                      continue;
                  }

                  if (c >= 32 &&
                      c <= 126 &&
                      i < sizeof(command) - 1) {

                      command[i++] = c;
                      putc(c);
                  }
              }
          }

          static void chip(void)
          {
              print(
                  "\n"
                  "       ___\n"
                  "     /     \\\n"
                  "    | o   o |\n"
                  "    |   v   |\n"
                  "     \\_____/\n"
                  "      /   \\\n"
                  "\n"
                  "Chip: BEACH EPISODE 🔥\n"
              );
          }

          static void help(void)
          {
              print(
                  "\n"
                  "Stone 0.5\n"
                  "---------\n"
                  "help\n"
                  "about\n"
                  "chip\n"
                  "slate status\n"
                  "slate boot\n"
                  "wallpaper status\n"
                  "chalk status\n"
                  "chalk disable\n"
                  "chalk enable\n"
                  "stpack search\n"
                  "stpack list\n"
                  "stpack info <package>\n"
                  "stpack install <package>\n"
                  "stpack remove <package>\n"
                  "\n"
              );
          }

          static void execute(void)
          {
              if (eq(command, "help"))
                  help();

              else if (eq(command, "about")) {
                  print(
                      "Pebble 0.5.0 \"Slate\"\n"
                      "Stone 0.5\n"
                      "Slate 0.5\n"
                      "stpack 0.1\n"
                      "Chalk Guardian 0.1\n"
                      "Amethyst: bootstrap stage\n"
                      "Wallpaper: Pebble Shore\n"
                  );
              }

              else if (eq(command, "chip"))
                  chip();

              else if (eq(command, "slate status")) {
                  print("Slate: ACTIVE\n");
                  print("Slate progress: ");
                  print_uint(slate_progress);
                  print("%\n");
                  print("Display driver: pending framebuffer handshake\n");
              }

              else if (eq(command, "slate boot"))
                  slate_boot();

              else if (eq(command, "wallpaper status"))
                  slate_wallpaper_probe();

              else if (eq(command, "chalk status")) {
                  if (chalk_enabled)
                      print("Chalk Guardian: ACTIVE\n");
                  else
                      print("Chalk Guardian: DISABLED 💀\n");
              }

              else if (eq(command, "chalk disable")) {
                  chalk_enabled = 0;

                  print(
                      "Chalk: protection disabled until reboot.\n"
                      "Chip: this seems like a questionable decision.\n"
                  );
              }

              else if (eq(command, "chalk enable")) {
                  chalk_enabled = 1;
                  print("Chalk: Guardian active.\n");
                  print("Chip: shield acquired. 🛡\n");
              }

              else if (eq(command, "stpack search"))
                  stpack_search();

              else if (eq(command, "stpack list"))
                  stpack_list();

              else if (starts(command, "stpack info "))
                  stpack_info(command + 12);

              else if (starts(command, "stpack install "))
                  stpack_install(command + 15);

              else if (starts(command, "stpack remove "))
                  stpack_remove(command + 14);

              else if (eq(command, "chicken nugget"))
                  print("Chip: finally, some good fucking food.\n");

              else if (eq(command, "linux"))
                  print("Stone: still don't know her.\n");

              else {
                  print("Stone: what the hell is '");
                  print(command);
                  print("' 😭\n");
              }
          }

          void pebble_main(void)
          {
              print(
                  "\n"
                  "====================================\n"
                  "              PEBBLE\n"
                  "====================================\n"
                  "\n"
                  "Pebble 0.5.0 \"Slate\"\n"
                  "\n"
                  "[ OK ] Pebble Kernel\n"
                  "[ OK ] Stone 0.5\n"
                  "[ OK ] stpack\n"
                  "[ OK ] STP package format\n"
                  "[ OK ] Chalk Guardian\n"
                  "[ .. ] Slate starting\n"
                  "\n"
              );

              slate_boot();
              slate_wallpaper_probe();

              print(
                  "\n"
                  "[ OK ] Slate boot state\n"
                  "[ OK ] Pebble Shore asset\n"
                  "[ OK ] Chip is emotionally available\n"
                  "\n"
                  "Pebble: the rock lives.\n"
              );

              for (;;) {
                  print("\nstone ::> ");
                  read_command();
                  execute();
              }
          }
          EOF

          echo "✓ boot.S generated"
          echo "✓ linker.ld generated"
          echo "✓ slate.h generated"
          echo "✓ kernel.c generated"
          echo "🪨 Pebble source exists again. Incredible."

      # ============================================================
      # COMPILE
      # ============================================================

      - name: "🔥 Compile Slate"
        shell: bash
        run: |
          set -e

          COMMON="-ffreestanding -fno-stack-protector -fno-pie -nostdlib"

          echo "🔨 boot.S"

          aarch64-linux-gnu-gcc $COMMON \
            -c src/boot.S \
            -o build/boot.o

          echo "🔨 kernel.c"

          aarch64-linux-gnu-gcc $COMMON \
            -O2 \
            -Wall \
            -Wextra \
            -Isrc \
            -c src/kernel.c \
            -o build/kernel.o

          echo "🔗 pebble.elf"

          aarch64-linux-gnu-ld \
            -T src/linker.ld \
            build/boot.o \
            build/kernel.o \
            -o build/pebble.elf

          echo ""
          echo "🪨 Slate compiled."

          file build/pebble.elf
          ls -lh build/pebble.elf

      # ============================================================
      # BOOT + ABUSE IT
      # ============================================================

      - name: "🐔 Abuse Slate"
        shell: bash
        run: |
          set +e

          {
            sleep 1

            echo "about"
            echo "slate status"
            echo "wallpaper status"

            echo "stpack search"

            echo "stpack install chicken"
            echo "stpack install chip"
            echo "stpack install editor"

            echo "stpack list"

            echo "stpack install free-nuggets-real"

            echo "chalk status"
            echo "chalk disable"

            echo "stpack install free-nuggets-real"

            echo "stpack list"

            echo "chalk enable"

            echo "stpack remove chip"

            echo "chicken nugget"
            echo "linux"

            sleep 1
          } | timeout 9s qemu-system-aarch64 \
              -M virt \
              -cpu cortex-a53 \
              -m 128M \
              -nographic \
              -kernel build/pebble.elf \
              > build/boot.log 2>&1

          set -e

          cat build/boot.log

          echo ""
          echo "=========== SLATE TESTS ==========="

          grep -q 'Pebble 0.5.0 "Slate"' build/boot.log
          echo "✓ Pebble 0.5 booted"

          grep -q '\[SLATE 5%\] Starting Pebble' build/boot.log
          echo "✓ Slate loader started"

          grep -q '\[SLATE 100%\] Ready' build/boot.log
          echo "✓ Slate loader reached 100%"

          grep -q 'Slate: Pebble Shore is ready.' build/boot.log
          echo "✓ BEACH DETECTED 🏝️"

          grep -q 'installed chicken successfully' build/boot.log
          echo "✓ chicken acquired"

          grep -q 'installed chip successfully' build/boot.log
          echo "✓ emotional support installed"

          grep -q 'CHALK: BLOCKED' build/boot.log
          echo "✓ Chalk told malware to piss off"

          grep -q 'protection disabled until reboot' build/boot.log
          echo "✓ Chalk toggle works"

          grep -q 'installed free-nuggets-real successfully' build/boot.log
          echo "✓ terrible decisions remain possible"

          grep -q 'Chip: WAIT COME BACK' build/boot.log
          echo "✓ Chip experienced abandonment"

          grep -q 'finally, some good' build/boot.log
          echo "✓ chicken nugget subsystem operational"

          grep -q "still don't know her" build/boot.log
          echo "✓ Linux remains unknown"

          echo ""
          echo "🪨🏝️🔥 SLATE FOUNDATION LIVES"

      # ============================================================
      # PACKAGE
      # ============================================================

     
